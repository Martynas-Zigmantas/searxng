# Alexandria on node2: Portainer Git stack "alexandria" (repo Martynas-Cloud/searxng, ref refs/heads/master,
# compose path deploy/alexandria.portainer.yml). Environment variables: only the three ALEXANDRIA_OIDC_* below,
# for the Alexandria account; without them everything else works.
# Portainer can't build: run ~/searxng/deploy/build-image.sh on node2 first, then deploy / "Pull and redeploy".
# search.jack-sally.com -> reverse proxy -> 192.168.178.27:48777
name: alexandria

services:
  core:
    container_name: alexandria-core
    image: alexandria:latest
    pull_policy: never
    restart: always
    ports:
      - "0.0.0.0:48777:8080"
    environment:
      - SEARXNG_BASE_URL=https://search.jack-sally.com/
      - SEARXNG_VALKEY_URL=valkey://alexandria-valkey:6379/0
      # Alexandria account (searx/accounts.py): sign in with Pocket ID (deploy/pocket-id.portainer.yml).
      # Set these three as stack environment variables in Portainer (values in Bitwarden
      # "Alexandria account (Pocket ID)"); left empty there is no Sign in button.
      - ALEXANDRIA_OIDC_ISSUER=${ALEXANDRIA_OIDC_ISSUER:-}
      - ALEXANDRIA_OIDC_CLIENT_ID=${ALEXANDRIA_OIDC_CLIENT_ID:-}
      - ALEXANDRIA_OIDC_CLIENT_SECRET=${ALEXANDRIA_OIDC_CLIENT_SECRET:-}
    volumes:
      # On first start the image writes /etc/searxng/settings.yml here with a random secret_key and
      # `use_default_settings: true` (everything else comes from searx/settings.yml in the image).
      # To override something, edit it in the volume (see deploy/settings.example.yml) and restart.
      - alexandria-config:/etc/searxng
      - alexandria-data:/var/cache/searxng

  valkey:
    container_name: alexandria-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    restart: always
    volumes:
      - alexandria-valkey:/data

volumes:
  alexandria-config:
  alexandria-data:
  alexandria-valkey:
