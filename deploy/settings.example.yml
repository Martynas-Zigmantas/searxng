# Optional overrides. The container writes /etc/searxng/settings.yml itself on first start (volume
# alexandria-config, random secret_key); add lines like these to it only if you want to change a default.
# Everything not listed comes from searx/settings.yml in the image (name, app launcher, site icons, colours).
use_default_settings: true

server:
  secret_key: "change-me"          # openssl rand -hex 32
  limiter: false                   # personal instance behind the reverse proxy
  image_proxy: true

search:
  favicon_resolver: "duckduckgo"   # site icons next to results (fetched by the server, not your browser)
  formats: [html, json]

valkey:
  url: valkey://alexandria-valkey:6379/0
